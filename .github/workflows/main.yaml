name: Main

on:
    push:
    pull_request:

jobs:
    php-cs-fixer:
        runs-on: ubuntu-latest
        name: Coding Standards
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache dependencies
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: PHP Coding Standards Fixer
              run: make fix-check

    phpstan:
        runs-on: ubuntu-latest
        name: PHPStan (PHP ${{ matrix.php-version }})
        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.2', '8.4']
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache dependencies
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Validate Composer configuration
              run: composer validate --strict

            - name: Run PHPStan
              run: make phpstan

    phpunit:
        runs-on: ubuntu-latest
        name: PHPUnit (PHP ${{ matrix.php-version }})
        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.2', '8.4']
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache dependencies
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Assert doctrine/collections major matches PHP version
              run: |
                  expected=2
                  if [ "${{ matrix.php-version }}" = "8.4" ]; then expected=3; fi
                  installed=$(composer show doctrine/collections --format=json | php -r 'echo explode(".", json_decode(stream_get_contents(STDIN), true)["versions"][0])[0];')
                  echo "doctrine/collections major: ${installed} (expected ${expected})"
                  test "${installed}" = "${expected}"

            - name: Run tests
              run: make tests
